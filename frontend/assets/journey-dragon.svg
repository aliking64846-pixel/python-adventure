<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061b24"/><stop offset=".5" stop-color="#073c34"/><stop offset="1" stop-color="#02130f"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#66ff9a" stop-opacity=".8"/><stop offset="1" stop-color="#66ff9a" stop-opacity="0"/></radialGradient>
 <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8dff9c"/><stop offset=".45" stop-color="#21bd68"/><stop offset="1" stop-color="#07552e"/></linearGradient>
 <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#75ff8d"/><stop offset=".55" stop-color="#25c96b"/><stop offset="1" stop-color="#087340"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
 <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="15" flood-opacity=".45"/></filter>
</defs>
<rect width="1200" height="700" fill="url(#sky)"/>
<circle cx="250" cy="180" r="180" fill="url(#glow)" filter="url(#blur)"/>
<path d="M0 430 Q170 300 340 430 T700 420 T1200 390 V700 H0Z" fill="#031b15"/>
<path d="M0 510 Q180 430 350 500 T700 485 T1200 455 V700 H0Z" fill="#05281c"/>
<g opacity=".55" fill="#2ee77a">
 <circle cx="90" cy="350" r="7"/><circle cx="155" cy="290" r="5"/><circle cx="1040" cy="270" r="6"/><circle cx="1110" cy="350" r="4"/>
</g>
<g filter="url(#shadow)">
 <ellipse cx="575" cy="595" rx="250" ry="35" fill="#000" opacity=".45"/>
 <!-- wings -->
 <path d="M470 365 Q285 150 155 205 Q300 260 330 445 Q385 380 470 365Z" fill="url(#wing)" stroke="#aaffb3" stroke-width="6"/>
 <path d="M680 365 Q850 150 1000 205 Q855 260 825 445 Q765 380 680 365Z" fill="url(#wing)" stroke="#aaffb3" stroke-width="6"/>
 <!-- tail -->
 <path d="M690 535 Q865 575 950 495 Q870 625 675 580Z" fill="#149654" stroke="#77ff91" stroke-width="6"/>
 <!-- body -->
 <ellipse cx="575" cy="470" rx="145" ry="145" fill="url(#body)" stroke="#b2ffbd" stroke-width="7"/>
 <ellipse cx="575" cy="305" rx="125" ry="115" fill="url(#body)" stroke="#b2ffbd" stroke-width="7"/>
 <!-- horns -->
 <path d="M500 225 L475 145 L535 205Z" fill="#eaffd9"/><path d="M650 225 L675 145 L615 205Z" fill="#eaffd9"/>
 <!-- ears -->
 <path d="M475 275 Q405 240 430 310 Q455 340 490 320Z" fill="#2fc86c"/>
 <path d="M675 275 Q745 240 720 310 Q695 340 660 320Z" fill="#2fc86c"/>
 <!-- eyes -->
 <ellipse cx="525" cy="300" rx="24" ry="30" fill="#fff"/><ellipse cx="625" cy="300" rx="24" ry="30" fill="#fff"/>
 <circle cx="530" cy="305" r="10" fill="#123c26"/><circle cx="620" cy="305" r="10" fill="#123c26"/>
 <!-- snout -->
 <ellipse cx="575" cy="350" rx="65" ry="45" fill="#b0ffb4" opacity=".95"/>
 <circle cx="548" cy="350" r="7" fill="#17683d"/><circle cx="602" cy="350" r="7" fill="#17683d"/>
 <path d="M555 375 Q575 390 595 375" fill="none" stroke="#17683d" stroke-width="6" stroke-linecap="round"/>
 <!-- belly -->
 <path d="M535 425 Q575 395 615 425 L630 550 Q575 590 520 550Z" fill="#b8f6a6" opacity=".85"/>
 <!-- laptop -->
 <rect x="505" y="435" width="140" height="85" rx="10" fill="#06212a" stroke="#55e6ff" stroke-width="6"/>
 <rect x="520" y="450" width="110" height="55" rx="6" fill="#031017"/>
 <text x="575" y="490" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#55e6ff">Py</text>
 <path d="M485 525 H665 L690 548 H460Z" fill="#0a3540" stroke="#55e6ff" stroke-width="5"/>
</g>
<g opacity=".9">
 <rect x="55" y="565" width="170" height="70" rx="12" fill="#06231b" stroke="#31e77b" stroke-width="3"/>
 <text x="140" y="608" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#aaffbd">PYTHON</text>
 <text x="140" y="628" text-anchor="middle" font-family="Arial" font-size="14" fill="#70e99b">LEARN • BUILD • PLAY</text>
</g>
</svg>